  integration-aggregate:
    needs: integration-shard-6
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout candidate
      uses: actions/checkout@v7
    - name: Download all six shard receipts
      uses: actions/download-artifact@v4
      with:
        pattern: solreign-integration-receipt-*-${{ github.sha }}
        path: .gstack/integration-gate/aggregate-receipts
        merge-multiple: true
    - name: Download checkpointed build manifest
      uses: actions/download-artifact@v4
      with:
        name: integration-build-manifest-${{ github.sha }}
        path: .gstack/integration-build
    - name: Verify complete SOLREIGN integration receipt set
      run: |
        sha256sum --check .gstack/integration-build/build-manifest.sha256
        python3 -B Tools/_Solreign/IntegrationGate/solreign_integration_gate.py --verify-receipts .gstack/integration-gate/aggregate-receipts --build-manifest .gstack/integration-build/build-manifest.sha256

  ci-success:
    name: Build & Test Debug
    needs: integration-aggregate
    runs-on: ubuntu-latest
    steps:
    - name: CI succeeded
      run: exit 0
