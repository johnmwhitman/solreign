name: Build & Test Debug

on:
  push:
    branches: [ master, staging, stable ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize, ready_for_review ]
    branches: [ master, staging, stable ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  build:
    if: github.actor != 'PJBot' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
    - name: Checkout Master
      uses: actions/checkout@v7

    - name: Setup Submodule
      run: git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: git -C RobustToolbox submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Stamp integration build
      run: |
        mkdir -p .gstack/integration-build
        test -d bin/Content.Client
        test -d bin/Content.Server
        git rev-parse HEAD > .gstack/integration-build/candidate-sha
        dotnet --version > .gstack/integration-build/dotnet-version
        git submodule status --recursive > .gstack/integration-build/submodules.txt
        find bin/Content.IntegrationTests bin/Content.Client bin/Content.Server Content.IntegrationTests/obj -type f -print | LC_ALL=C sort > .gstack/integration-build/artifact-files.txt
        while IFS= read -r file; do sha256sum "$file"; done < .gstack/integration-build/artifact-files.txt > .gstack/integration-build/artifact.sha256
        sha256sum .gstack/integration-build/candidate-sha .gstack/integration-build/dotnet-version .gstack/integration-build/submodules.txt .gstack/integration-build/artifact-files.txt .gstack/integration-build/artifact.sha256 > .gstack/integration-build/build-manifest.sha256

    - name: Run Content.Tests
      shell: pwsh
      run: dotnet test --no-build --configuration DebugOpt Content.Tests/Content.Tests.csproj -- NUnit.ConsoleOut=0 NUnit.TestOutputXml="logs" NUnit.WorkDirectory="$(pwd)/test_results"

    - name: Archive Content.Tests logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: solreign-content-tests-${{ github.sha }}
        path: test_results/**
        retention-days: 7
        compression-level: 6
        overwrite: true

    - name: Checkpoint integration build
      uses: actions/upload-artifact@v4
      with:
        name: integration-build-${{ github.sha }}
        path: |
          bin/Content.IntegrationTests/**
          bin/Content.Client/**
          bin/Content.Server/**
          Content.IntegrationTests/obj/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        compression-level: 3
        overwrite: true

    - name: Checkpoint integration build manifest
      uses: actions/upload-artifact@v4
      with:
        name: integration-build-manifest-${{ github.sha }}
        path: .gstack/integration-build/**
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        compression-level: 9
        overwrite: true

  # These are explicit jobs, rather than a matrix, so each green shard is a
  # durable checkpoint and no two integration shards consume a host at once.
  integration-shard-1:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - name: Checkout candidate
      uses: actions/checkout@v7
    - name: Setup Submodule
      run: git submodule update --init --recursive
    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5
    - name: Update Engine Submodules
      run: git -C RobustToolbox submodule update --init --recursive
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Populate NuGet cache
      run: dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj
    - name: Restore checkpointed build
      uses: actions/download-artifact@v4
      with:
        name: integration-build-${{ github.sha }}
        path: .
    - name: Restore checkpointed build manifest
      uses: actions/download-artifact@v4
      with:
        name: integration-build-manifest-${{ github.sha }}
        path: .gstack/integration-build
    - name: Validate checkpointed build
      run: |
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        test -d bin/Content.Client
        test -d bin/Content.Server
        test -f bin/Content.IntegrationTests/Content.IntegrationTests.dll
        test -f Content.IntegrationTests/obj/project.assets.json
        test -f Content.IntegrationTests/obj/Content.IntegrationTests.csproj.nuget.g.props
        test -f Content.IntegrationTests/obj/Content.IntegrationTests.csproj.nuget.g.targets
        test "$(cat .gstack/integration-build/candidate-sha)" = "$GITHUB_SHA"
        test "$(cat .gstack/integration-build/dotnet-version)" = "$(dotnet --version)"
        git submodule status --recursive > /tmp/solreign-current-submodules.txt
        cmp .gstack/integration-build/submodules.txt /tmp/solreign-current-submodules.txt
        find bin/Content.IntegrationTests bin/Content.Client bin/Content.Server Content.IntegrationTests/obj -type f -print | LC_ALL=C sort > /tmp/solreign-current-artifact-files.txt
        cmp .gstack/integration-build/artifact-files.txt /tmp/solreign-current-artifact-files.txt
        sha256sum --check .gstack/integration-build/artifact.sha256
        sha256sum --check .gstack/integration-build/build-manifest.sha256
    - name: Run SOLREIGN integration shard 1
      env:
        DOTNET_gcServer: 1
      run: python3 -B Tools/_Solreign/IntegrationGate/solreign_integration_gate.py --no-build --shard 1 --receipt-directory .gstack/integration-gate/receipts --build-manifest .gstack/integration-build/build-manifest.sha256
    - name: Upload shard 1 receipt
      uses: actions/upload-artifact@v4
      with:
        name: solreign-integration-receipt-1-${{ github.sha }}
        path: .gstack/integration-gate/receipts/shard-1.json
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Archive shard 1 logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: solreign-integration-logs-1-${{ github.sha }}
        path: |
          .gstack/integration-gate/**
        include-hidden-files: true
        retention-days: 7
        compression-level: 9
        overwrite: true

