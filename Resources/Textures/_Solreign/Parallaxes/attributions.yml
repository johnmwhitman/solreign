# Sector/ — the generic SolreignSector backdrop (Resources/Prototypes/_Solreign/parallax.yml),
# wired to the four rotation maps without a bespoke station identity (Meridian, Leviathan,
# Terminus, Oasis). Base layer is fully procedural (Pillow/numpy periodic value-noise + wrapped
# star scatter — tileable by construction, not AI-generated). Neb + Sat layers are AI-generated
# (MiniMax image-01), then processed: resized to the stock 1920x1080 contract, toned down to the
# restrained brand palette, and given a luminance+vignette alpha so black background and all four
# edges fade to fully transparent (the seamless procedural BG layer shows through underneath —
# this is what makes the tile boundary a non-issue for these two layers). Full generation
# parameters (prompts, cost) and seam-verification numbers are recorded in
# docs/receipts/solreign-parallax/PARALLAX-2026-07-16.md in this repo.

