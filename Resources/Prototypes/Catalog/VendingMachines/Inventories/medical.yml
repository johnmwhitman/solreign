# Core medical supply vendor
- type: vendingMachineInventory
  id: NanoMedPlusInventory
  startingInventory:
    # Medical Essential Gear
    ClothingBeltMedicalFilled: 2
    # Shared Essential
    HandheldHealthAnalyzer: 3
    JetInjector: 3
    # Paramed Essential Gear
    ClothingBeltMedicalEMTFilled: 1
    EmergencyRollerBedSpawnFolded: 1
    BoxBodyBag: 1
    # Extra Expendable Gear
    Gauze: 4
    Brutepack: 4
    Ointment: 4
    Bloodpack: 4
    # Optional / Situational Gear
    BoxBottle: 3
    Defibrillator: 2 # Easily shared between several people
    Syringe: 4
    PillCanisterTricordrazine: 4
    ClothingOuterHospitalGown: 2 # Not a popular item, so less stock
    # MAPSEED-AUDIT-2026-07-16 Gap 5 fix (feat/lore-trail): SolreignEgg08 was only reachable via
    # NanoMedInventory (VendingMachineWallMedical, present on just Leviathan+Terminus). This is the
    # universal NanoMed Plus pack, carried by VendingMachineMedical -- present on all 7 rotation
    # maps -- so this one line closes the reachability gap portfolio-wide, prototype-level only.
    SolreignEgg08: 1 # Solreign easter egg
  contrabandInventory:
    PillCanisterRandom: 3
    PillSpaceDrugs: 3
    FoodApple: 1

