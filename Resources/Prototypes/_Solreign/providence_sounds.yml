# "Providence" — Solreign's station voice. 60 files, 12 categories: 50 original lines plus the
# 2026-07-22 ten-line idle-musings expansion. Generated with gemini-2.5-flash-tts (Kore voice);
# see Resources/Audio/_Solreign/Providence/ATTRIBUTION.txt for the durable in-repo provenance.
#
# One soundCollection per category — same idiom as upstream Resources/Prototypes/SoundCollections/
# announcements.yml's RoundEnd/PowerOn collections. C# side reads these ids from
# Content.Server/_Solreign/Providence/ProvidenceVoiceMap.cs; keep the two in lockstep by hand.
#
# Wired currently (PlayLine/PlayLineTo callers are distributed across Providence and station-identity
# systems):
#   shift_start, shift_end, title_ceremony, event_audit, event_acid_storm, idle_musings, hot_potato,
#   death_commiseration, new_player_welcome.
# Staged, not wired this wave (collections ready, no call site yet):
#   event_raid — no production PlayLine call currently selects this category.
#   zoo_breach — NO zoo faction-flip mechanic exists in the codebase to hook (zoo_fauna.yml's
#     exhibit mobs are explicitly passive/PG, no NpcFactionMember); needs that mechanic built first.
#   cake_denial — no cake entity/examine handler exists in the codebase to hook.

