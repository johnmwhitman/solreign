# Solreign weird botany: PLANTS
# Eight farmable Solreign crops migrated to upstream's entity/component botany model.
# Sprite paths reuse upstream hydroponics RSIs; produce and packet entities retain
# their Solreign color tints and gameplay contracts.

# 1. GLOW CROP A — the lumen melon. Acid-green, glows, juices into rainbow juice.
- type: entity
  parent: BasePlant
  id: SolreignLumenMelonPlants
  name: lumen melon vines
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/watermelon.rsi
  - type: PlantData
    name: seeds-solreign-lumen-melon-name
    packetPrototype: SolreignLumenMelonSeeds
    productPrototypes: [ SolreignFoodLumenMelon ]
  - type: Plant
    lifespan: 55
    maturation: 12
    production: 3
    yield: 2
    potency: 10
    growthStages: 6
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 10
        potencyDivisor: 10
      Water:
        min: 1
        max: 10
        potencyDivisor: 10
      SolreignLumenSap:
        min: 2
        max: 10
        potencyDivisor: 10
      SolreignRainbowJuice:
        min: 1
        max: 5
        potencyDivisor: 20

# 2. GLOW CROP B — the nightshift glowcap. A soft cyan mushroom for the late crew.
- type: entity
  parent: BasePlant
  id: SolreignNightshiftGlowcapPlants
  name: nightshift glowcaps
  components:
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/chanterelle.rsi
  - type: PlantData
    noun: seeds-noun-spores
    name: seeds-solreign-nightshift-glowcap-name
    packetPrototype: SolreignNightshiftGlowcapSeeds
    productPrototypes: [ SolreignFoodNightshiftGlowcap ]
  - type: Plant
    lifespan: 35
    maturation: 10
    production: 7
    yield: 4
    potency: 5
    growthStages: 3
  - type: PlantGrowth
    waterConsumption: 0.6
    nutrientConsumption: 0.5
  - type: PlantAtmospheric
    lowHeatTolerance: 278
    highHeatTolerance: 298
  - type: PlantChemicals
    chemicals:
      Nutriment:
        min: 1
        max: 15
        potencyDivisor: 15
      SolreignLumenSap:
        min: 2
        max: 10
        potencyDivisor: 10
      SolreignOvertimeOil:
        min: 1
        max: 6
        potencyDivisor: 15

