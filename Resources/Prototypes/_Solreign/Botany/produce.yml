# THE CORPORATE KUDZU ITSELF — fast-spreading, strictly decorative.
# Parents upstream Kudzu (keeps EdgeSpreader/GrowingKudzu/destructible wiring),
# then de-fangs it: no movement slow, easier to clear, faster spread, acid-green.
- type: entity
  parent: Kudzu
  id: SolreignKudzuCorporate
  name: corporate kudzu
  suffix: solreign
  description: Decorative groundcover from the Solreign Office Beautification Initiative. It grows at the speed of quarterly targets and harms nothing but sightlines. Prune with anything sharp.
  components:
  - type: Sprite
    sprite: Objects/Misc/kudzu.rsi
    state: kudzu_11
    drawdepth: Overdoors
    color: "#b6ff7a"
  - type: Kudzu
    # Decorative-static: never spreads to neighbor tiles, so it cannot overrun a
    # round (Prob(0) is always false in KudzuSystem.OnKudzuSpread). Same pattern
    # as ShadowKudzuWeak. growthTickChance only matures its own sprite (visual
    # flavor) and spawns nothing on its own.
    growthTickChance: 0.1
    spreadChance: 0
  - type: SpeedModifierContacts # decorative: does NOT slow anyone down
    walkSpeedModifier: 1.0
    sprintSpeedModifier: 1.0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 5 # easy pruning; beautification is reversible
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
