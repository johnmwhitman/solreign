# Solreign weird botany: PRODUCE + the corporate kudzu vine
# Produce pattern verified against upstream FoodApple / FoodPumpkin
# (Resources/Prototypes/Entities/Objects/Consumable/Food/produce.yml);
# kudzu pattern verified against upstream Kudzu / WeakKudzu
# (Resources/Prototypes/Entities/Objects/Misc/kudzu.yml).
# Sprites reuse upstream produce RSIs with color tints; glow = PointLight,
# same trick as upstream PottedPlantBioluminscent. TODO(sprite factory): bespoke art.

# 1. Lumen melon — glowing harvest, glow crop A.
- type: entity
  parent: FoodProduceBase
  id: SolreignFoodLumenMelon
  name: lumen melon
  suffix: solreign
  description: A melon that photosynthesizes overtime and stores the surplus as pure acid-green glow. Legally, it is a lighting fixture that happens to be delicious.
  components:
  - type: FlavorProfile
    flavors:
    - watermelon
    - light
  - type: Sprite
    sprite: Objects/Specific/Hydroponics/watermelon.rsi
    color: "#b6ff7a"
  - type: PointLight
    radius: 2.0
    energy: 1.2
    color: "#7cf64b"
  - type: Item
    size: Normal
    heldPrefix: produce
  - type: Solution
    solution:
      reagents:
      - ReagentId: Nutriment
        Quantity: 5
      - ReagentId: Water
        Quantity: 5
      - ReagentId: SolreignLumenSap
        Quantity: 5
  - type: Produce
    plantId: SolreignLumenMelonPlants
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: SolreignRainbowJuice
        Quantity: 10

