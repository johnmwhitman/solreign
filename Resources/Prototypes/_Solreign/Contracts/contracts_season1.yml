# --- SALVAGE RAID category (John's mandate, beyond the base spec) ---
#
# Group-scaled team-ups: players register on the raid roster at the Contracts Board, then any participant
# launches it. At launch the objective size AND the per-head Standing lock to the roster registered at that
# moment (accept-time scaling, ContractRules.SalvageScaledAmount / SalvageStanding):
#   objective  = base amount x participants   (per-head workload stays flat)
#   per-head   = base standing + 1 per teammate beyond the first  (per-head pay goes UP)
# Recruiting a colleague is therefore always the profitable move. The Company encourages synergy.
#
# Anti-grief: every deliverable below is freely obtainable in bulk (salvage wrecks, mining, litter) —
# nothing role-critical, nothing another player would carry (rule 3). Roster capped (rule 7 spirit).
# Tags verified against Resources/Prototypes/tags.yml: SalvageScrap, Ore, Trash.

# S1. The flagship raid — haul scrap back from the void.
- type: solreignContract
  id: SolRaidScrapReclamation
  name: solreign-raid-scrap-reclamation-name
  description: solreign-raid-scrap-reclamation-desc
  scope: SalvageRaid
  standing: 3
  maxParticipants: 6
  entries:
  - name: solreign-contract-item-scrap
    amount: 5 # per registered participant, scaled at launch
    whitelist:
      tags:
      - SalvageScrap

# S2. Mining crew special.
