# Solreign Contracts — Season 1 launch content (design spec §9, consolidated for Milestone 3).
# All PG, all delivery-shaped, all achievable with existing upstream items. Voice: unsettlingly upbeat
# internal comms. Compliance is its own reward.
#
# This file supersedes the split contracts_general.yml / contracts_salvage.yml (M1/M2) — same 13
# prototypes (the spec's 10 numbered examples, three of which are 2-3-link chains, plus the 3 John's-mandate
# salvage raids), one file, one place to read the whole Season 1 board.
#
# Whitelists: every tag below was verified against Resources/Prototypes/tags.yml at authoring time
# (spec §10.4). Substitutions from the spec draft where a tag does not exist in this fork:
#   - #7 Hydration Metrics -> Preventative Nutrition Audit (no water tag; Fruit tag exists)
#   - #6 Incident Documentation: v1 paper fallback (no photo system; Paper tag exists) per spec §9.6
#   - #10 Executive Lunch: fries -> donut (no fries tag; Burger/Donut/Cake tags exist)
#
# Milestone gating (enforced in ContractsSystem.IsIssuableInM1, not here):
#   - Department-scope contracts are authored but dormant until Department scope ships (contribution credit).
#   - Contracts with sabotageSpawns are authored but dormant until the sabotage spawner ships.
#
# Rank gating (M3): minRankIndex is enforced on BOTH personal claim and salvage-raid join
# (ContractRules.MeetsRankGate, ContractsSystem.TryClaim / TryJoinRaid).
#
# ITEM REWARDS (Wave 21, S21): contracts pay Corporate Standing only — SolreignContractPrototype
# has no item-payout field, deliberately (anti-grief by construction: the schema cannot spawn
# loot into the world on completion). The gear.yml 10-item reward pack is therefore wired as
# rank-gated shelf access instead: SolreignExecutiveVendorInventory (contracts_executive_vendor.yml)
# stocks all 10, and rank is itself earned from the Standing these contracts pay out
# (RankRules.Score). Grinding the board is, literally, how you buy the hat.

# 1. Personal fetch — the bread and butter, and the M1 exit-test contract.
- type: solreignContract
  id: SolContractColaAudit
  name: solreign-contract-cola-audit-name
  description: solreign-contract-cola-audit-desc
  scope: Personal
  standing: 3
  spesos: 250 # dormant until the spesos-payout API is confirmed (spec §10.5)
  easyTier: true # low-pop guarantee pool (v14 quest-board spec §2.2): no rank/dept gate, cola is
                  # vendor-obtainable with zero help.
  entries:
  - name: solreign-contract-item-cola
    amount: 5
    whitelist:
      tags:
      - Cola

