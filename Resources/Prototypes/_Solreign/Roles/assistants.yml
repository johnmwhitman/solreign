# Solreign — Assistant Jobs (clean-room build from upstream job idiom only).
# Five entry-level onboarding positions, one per department, deliberately more
# restricted than their upstream "intern"-tier counterparts (Medical Intern,
# Research Assistant, Technical Assistant, Cargo Technician all already exist
# upstream with Department + Maintenance access — these Solreign variants trade
# that Maintenance token away for a genuinely low-access, new-player-friendly
# first job). Kitchen Hand has no upstream low-tier equivalent at all.
#
# NOTE (naming overlap, flagged for review): two of these share display text
# with existing upstream jobs ("Medical Intern", "Research Assistant") because
# the assigning brief named them explicitly. Prototype IDs and loc keys are
# fully distinct (Solreign-prefixed) so there is no load-time collision, but
# a player will see two differently-scoped jobs with the same on-screen name
# in the character setup / late-join menus. See reviewer checklist.
#
# All five are ordinary crew — no AntagImmune/MindShieldImplant special (unlike
# greenshield.yml / nt_representative.yml, which are political Solreign-board
# seats deliberately excluded from antag selection). No requirements: these are
# meant to be pickable immediately by a brand-new player.

# ---------------------------------------------------------------------------
# Medical Intern (Solreign onboarding track)
# ---------------------------------------------------------------------------
- type: playTimeTracker
  id: JobSolreignMedicalIntern

# Reuses the existing MedicalIntern icon state (exact thematic match).
- type: jobIcon
  parent: JobIcon
  id: JobIconSolreignMedicalIntern
  icon:
    sprite: /Textures/Interface/Misc/job_icons.rsi
    state: MedicalIntern
  jobName: job-name-solreign-medical-intern

- type: job
  id: SolreignMedicalIntern
  name: job-name-solreign-medical-intern
  description: job-description-solreign-medical-intern
  playTimeTracker: JobSolreignMedicalIntern
  startingGear: SolreignMedicalInternGear
  icon: "JobIconSolreignMedicalIntern"
  supervisors: job-supervisors-medicine
  access:
  - Medical

- type: startingGear
  id: SolreignMedicalInternGear
  equipment:
    shoes: ClothingShoesColorWhite
    id: MedicalInternPDA
    ears: ClothingHeadsetMedical
    pocket2: BookMedicalReferenceBook

