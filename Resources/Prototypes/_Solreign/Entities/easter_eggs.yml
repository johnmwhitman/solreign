# A12. Metroid — spherical transit capsule (Engineering)
# SPRITE: orange-and-red segmented sphere with a glowing green core seam.
#
# BETA FEEDBACK item 3 (docs/BETA-FEEDBACK-01.md Lane A, "real functionality — roll/fast-move?"):
# studied three upstream idioms before picking one —
#   (1) rollerskates (Content.Shared/Clothing/EntitySystems/SkatesSystem.cs): equip-slot clothing,
#       friction/acceleration tuning + collision damage. Requires an equipped-state sprite this RSI
#       doesn't have (icon only) — worn in a visible slot would render blank.
#   (2) a real drivable vehicle (Content.Server/_Solreign/Vehicles/ — the RC car's bind + relay-input
#       idiom): full buckle/strap + movement-relay machinery, built for a car body you climb into,
#       not a ball you carry. Far more C# than "add functionality to an easter egg" warrants.
#   (3) HeldSpeedModifierComponent (Content.Shared/Item/HeldSpeedModifierSystem.cs) — stock, already
#       reused in-house for the OPPOSITE effect (portal_props.yml's companion cube: "heavy, slows you
#       down"). Applies purely from being held in a hand (GotEquippedHandEvent/GotUnequippedHandEvent
#       relay into RefreshMovementSpeedModifiersEvent) — no equip slot, no new sprite states, zero new
#       C#, zero render risk.
# (3) is the cheapest fun one and what's wired below: grip the capsule and you roll faster. Positive
# multipliers (mirrored the companion cube's negative ones) — this is the "fast-move" half of the
# ask, not the hamster-ball container half; documented here per the task's "document choice" ask.
# FIX (player-feedback batch 2026-07-16, item 3/25): BeachBall sets Item.sprite explicitly
# (Objects/Fun/Balls/beach_ball.rsi), so without this override the in-hand render prefers
# that explicit RsiPath over this entity's own Sprite override and keeps showing the plain
# beach ball once picked up. Repointing Item.sprite here + adding inhand-left/right to
# egg12_transit_orb.rsi (procedurally rigged, see docs/receipts/feedback-bugs/) fixes it.
- type: entity
  parent: BeachBall
  id: SolreignEgg12
  suffix: Solreign, easter egg
  name: spherical personal transit capsule
  description: Solreign claims the spinal compression required to fit inside is "entirely ergonomic." Somehow, gripping it firmly makes you roll along noticeably faster.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/egg12_transit_orb.rsi
    state: icon
  - type: Item
    sprite: _Solreign/EasterEggs/egg12_transit_orb.rsi
  - type: HeldSpeedModifier
    walkModifier: 1.3
    sprintModifier: 1.15

