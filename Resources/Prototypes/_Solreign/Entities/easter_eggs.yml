      visible: false
  # production batch 10 (worn-sprite wave): Spear's own Clothing (slots:[back,suitStorage])
  # sets no explicit sprite, so this fell back to base-Sprite-RSI resolution -- made
  # explicit here for robustness. New RSI carries strapped-weapon equipped-BACKPACK/
