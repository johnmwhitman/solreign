# A3. Doom — slayer's chestplate (Security)
# SPRITE: scarred dark-green sci-fi chestplate, battle-worn, faint orange scorch marks.
# FIX (2026-07-12, sprite factory batch beta01 — see assets/beta01-sprites/PROVENANCE.md): the
# worn/ground mismatch was that only `Sprite` (ground/inventory icon) was ever overridden here;
# `Clothing` (the component that actually drives the on-body worn render) was never set, so
# equipping this silently fell back to the parent ClothingOuterArmorBasic/Base's upstream
# security.rsi — i.e. you'd see the custom reliquary icon in your hand but a generic security
# vest once worn. Added a real `equipped-OUTERCLOTHING` (4-dir) state to the same RSI (a
# headless torso/shoulder render — the game draws the wearer's own head as a separate layer, so
# baking a helmet into this state would double up) and pointed `Clothing` at it.
- type: entity
  parent: ClothingOuterArmorBasic
  id: SolreignEgg03
  suffix: Solreign, easter egg
  name: slayer's reliquary chestplate
  description: Scratched, dented, and smelling faintly of brimstone. Ideal for hostile takeovers.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/egg03_chestplate.rsi
    state: icon
  - type: Clothing
    sprite: _Solreign/EasterEggs/egg03_chestplate.rsi

# A4. Metal Gear Solid — tactical cardboard container (Cargo)
# SPRITE: plain cardboard box with stenciled black text "NOTHING TO SEE HERE" and a cut viewport.
# Open state intentionally looks identical to closed — nothing to see here.
- type: entity
  parent: StealthBox
  id: SolreignEgg04
  suffix: Solreign, easter egg
  name: tactical relocation cardboard container
  description: Emblazoned with "Nothing to see here, keep moving." Fits one corporate spy.
  components:
  - type: Sprite
    noRot: true
    sprite: _Solreign/EasterEggs/egg04_cardboard_box.rsi
    layers:
    - state: icon
      map: ["enum.StorageVisualLayers.Base"]
    - state: icon_open
      map: ["enum.StorageVisualLayers.Door"]
  - type: EntityStorageVisuals
    stateBaseClosed: icon
    stateDoorOpen: icon_open

