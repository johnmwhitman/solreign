# Solreign easter-egg reskin pack — items 1-20 of section A,
# docs/research/solreign-creative-bible-agx.md.
# Additive cosmetic reskins: each parents a verified vanilla prototype and
# overrides name + description (+ suffix for admin spawn menus) plus a custom
# Solreign sprite from Textures/_Solreign/EasterEggs/ (factory: assets/
# sprites-batch2, provenance in that folder's PROVENANCE.md). Homage, not
# copy: no trademarked names, logos, or symbols.
#
# Sprite idiom notes:
# - Visualizer-driven parents keep their layer maps pointed at our states
#   (GunVisualLayers.Base, toy-sword "blade", SolutionContainerLayers.Fill,
#   StorageVisualLayers Base/Door) so appearance systems find their layers.
# - Fill/open companion states (icon1, icon2, icon_open) are copies of icon —
#   the "filled"/"open" art is baked into the base sprite by design.

# A1. Portal — handheld aperture device (Science / R&D)
# SPRITE: sleek white-and-acid-green ray gun with three claw prongs around a glowing circular aperture.
- type: entity
  parent: RevolverCapGun
  id: SolreignEgg01
  suffix: Solreign, easter egg
  name: experimental sub-spatial aperture device
  description: Do not look directly into the operational aperture, even if it promises cake.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/egg01_aperture.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]

# A2. The Legend of Zelda — golden trifecta paperweight (Cargo / Curator)
# SPRITE: three small golden triangles stacked into one larger triangle, faint glow, desk-toy base.
- type: entity
  parent: ToyFigurinePassenger
  id: SolreignEgg02
  suffix: Solreign, easter egg
  name: golden trifecta paperweight
  description: Hums with power, courage, and a sudden urge to smash nearby pottery.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/egg02_trifecta.rsi
