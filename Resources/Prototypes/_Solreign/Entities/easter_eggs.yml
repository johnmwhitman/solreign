# A15. Fallout — wrist-mounted post-apocalyptic organizer (Engineering)
# SPRITE: chunky retro wrist-mounted computer with a glowing acid-green phosphor screen, dials and knobs.
#
# BETA FEEDBACK item 4 (docs/BETA-FEEDBACK-01.md Lane A, "real functionality — health/status
# readout"): studied HealthAnalyzerSystem (Content.Server/Medical/HealthAnalyzerSystem.cs) and
# HandheldGpsSystem (Content.Shared/GPS/Systems/HandheldGpsSystem.cs) before writing
# SolreignWristOrganizerSystem. Reuses HealthAnalyzer's data sources (DamageableComponent,
# MobThresholdSystem) on USE (HandheldGPS's own trick is examine-only, and the parent's
# HandheldGPSComponent is untouched here, so the item keeps its GPS examine for free) rather than
# rebuilding the real analyzer's DoAfter+BoundUserInterface machinery — this is a one-shot SELF-scan
# popup, not a scanning tool aimed at other people. Dropped the radiation-dose line the old flavor
# text promised: RadiationReceiverComponent is [Access(typeof(RadiationSystem))] with no public
# getter to read it through (ANALYZER LAW: owning-system API only) — see
# Content.Server/_Solreign/EasterEggs/SolreignWristOrganizerRules.cs's doc comment. "Tells you
# exactly how doomed you are" ships instead as a literal doom-index percentage.
- type: entity
  parent: HandheldGPSBasic
  id: SolreignEgg15
  suffix: Solreign, easter egg
  name: wrist-mounted post-apocalyptic organizer
  description: A chunky, green-phosphor screen that tracks your vitals and tells you exactly how doomed you are, as a percentage.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/egg15_wrist_organizer.rsi
    state: icon
    layers:
    - state: icon
  - type: SolreignWristOrganizer

