# ──────────────────────────────────────────────────────────────────────────
# VAULT REWARD — end of the Auditor's Memo trail (Section 3 final reward)
# A locked secure crate for the hidden vault behind the AI core wall panel.
# Locked to Command access; the mapping wave decides final placement and may
# swap the access list once the vault room exists. Reward items are cosmetic
# name/description reskins of verified vanilla prototypes (same idiom as
# solreign_easter_eggs.yml) — a dedicated gold sprite is a later art-wave task.
# ──────────────────────────────────────────────────────────────────────────

- type: entity
  parent: ClothingBackpackSatchel
  id: SolreignGoldenParachutePack
  suffix: solreign, lore, vault reward
  name: the Golden Parachute
  description: A gleaming gold pack styled like a futuristic parachute. It will not save you from anything, but everyone who sees it will know you survived the boardroom.

- type: entity
  parent: TreasureCoinGold
  id: SolreignPlatinumShare
  suffix: solreign, lore, vault reward
  name: Solreign platinum share
  description: A legendary token of vested interest. Redeemable, allegedly, wherever Season Ledgers are balanced.

- type: entity
  parent: CrateBaseSecure
  id: SolreignVaultRewardCrate
  suffix: solreign, lore, vault
  name: Solreign compensation vault
  description: A heavily secured Solreign container stamped 'FINAL COMPENSATION PACKAGE — AUTHORIZED PERSONNEL ONLY'. The lock indicator glows acid green.
  components:
  - type: AccessReader
    access: [["Command"]]
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SolreignGoldenParachutePack
        - id: SolreignPlatinumShare
        - id: SolreignPaperAuditorMemo8

# ──────────────────────────────────────────────────────────────────────────
# SEASON 1 STATION-EVENT CLUES (beats 1-6) — "The Ledger Wakes"
# Source: docs/research/2026-07-11-season1-narrative-bible.md Section 1.
#
# Physical clues spawned by the admin-triggerable station events in
# Content.Server/_Solreign/Season1/ (see Prototypes/_Solreign/GameRules/season1.yml).
# Beats 1, 2, 3, 5 and 6 deliberately have no `content:` field here: each rule stamps the
# Paper component's text at spawn time via SharedPaperSystem.SetContent (Beat 1 personalizes
# the slip with a currently-alive crew member's name; Beat 2 with the round's live player
# count; Beat 3 rolls one of several pre-written transcript flavors; Beat 5 with how far into
# the round the rift tore open; Beat 6 with the live crew roster). Beat 4's plaque is the one
# exception — its engraved text never varies, so it's baked straight in below, the same idiom
# as the Auditor's Memos above.
# ──────────────────────────────────────────────────────────────────────────

- type: entity
  parent: PaperOffice
  id: SolreignPaperLedgerSlip
  suffix: solreign, season1, clue, beat1
  name: carbon-copied ledger slip
  description: A ledger slip signed in shimmering acid-green ink. It smells faintly of old copper and elderberries.

- type: entity
  parent: PaperOffice
  id: SolreignPaperInkClipboard
  suffix: solreign, season1, clue, beat2
  name: melted clipboard
  description: A clipboard half-fused into the deck plating. Whatever did this left a stamped serial number behind.

- type: entity
  parent: PaperOffice
  id: SolreignPaperGhostCabinetFolder
  suffix: solreign, season1, clue, beat3
  name: dusty manila folder
  description: A folder that smells of ozone and old paper, pulled from a filing cabinet that shouldn't exist.

- type: entity
  parent: PaperOffice
  id: SolreignPaperEmployeePlaque
  suffix: solreign, season1, clue, beat4
  name: employee-of-the-month plaque
  description: A bronze plaque, crudely hand-engraved over its original inscription.
  components:
  - type: Paper
    content: solreign-season1-beat4-plaque-content

- type: entity
  parent: PaperOffice
  id: SolreignPaperTypewriterKey
  suffix: solreign, season1, clue, beat5
  name: detached typewriter key
  description: A massive metal key stamped with the letter "S", still warm to the touch and smeared with acid-green ink.

- type: entity
  parent: PaperOffice
  id: SolreignPaperLedgerVolumeOne
  suffix: solreign, season1, clue, beat6, finale
  name: "The Ledger of Solreign: Volume I"
  description: A heavy leather-bound book. The final page is still being written.
