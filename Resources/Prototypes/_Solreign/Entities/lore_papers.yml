# Solreign Season 1 lore papers — "The Ledger Wakes".
# Source: docs/research/2026-07-11-season1-narrative-bible.md sections 3 + 4.
#
# Contents:
#   * 8 Auditor's Memos     — the treasure-hunt trail (Section 3). Each memo's
#                             clue text is baked in via the upstream pre-written
#                             paper idiom (Paper component `content:` locale key,
#                             see Catalog/Fills/Paper/manuals.yml).
#   * 20 handbook fragments — collectible Employee Handbook pages (Section 4).
#   * Vault Reward          — a locked secure crate ("the Golden Parachute
#                             compensation vault") for the end of the trail,
#                             plus its two reward reskins.
#   * Season 1 event clues  — physical clue props for the admin-triggerable
#                             beat 1-3 station events (Section 1). Content is
#                             stamped at spawn time by the event rule, not
#                             baked into the prototype — see the section below.
#
# NO map placement here — the mapping wave places memos along the trail
# (Arrival Hub → Crew Quarters → Hydroponics → Tech Storage → Cargo Bay →
# Atmospherics → Maintenance B → AI Core Duct → hidden vault) and scatters
# the handbook pages. Locale: Locale/en-US/_Solreign/lore-papers.ftl.

# ──────────────────────────────────────────────────────────────────────────
