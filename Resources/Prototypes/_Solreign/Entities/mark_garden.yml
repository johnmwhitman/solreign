# ---------------------------------------------------------------- the garden fixture (C5)
# Name/description are authored inline (the signage.yml EntityLocData-fallback idiom); the same
# strings live as solreign-mark-garden-name/-desc in mark.ftl as the copy-pack contract source.

- type: entity
  id: SolreignMarkGarden
  name: Continuity Garden
  suffix: Solreign, Mark
  description: Company exhibit for long-horizon personnel retention. Fixed fixtures only. Objects here outlive rounds, excuses, and several middle managers. Do not rearrange. Do not ask for Task 4.
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.1"
        density: 190
        hard: false
  - type: Sprite
    sprite: _Solreign/solreign-marks.rsi
    state: garden
    noRot: true
  - type: SolreignMarkGarden
