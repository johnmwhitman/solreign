  id: SolreignPaperTerminusLog1
  name: "Grand Prix inaugural race log"
  description: A grease-stained scorecard from what looks like the first-ever lap around this track.
  components:
  - type: Paper
    content: solreign-terminus-log-1

- type: entity
  parent: SolreignPaperLoreBase
  id: SolreignPaperTerminusLog2
  name: "salvage crew transmission, partial"
  description: A hand-copied radio transcript, the handwriting getting worse toward the bottom.
  components:
  - type: Paper
    content: solreign-terminus-log-2

- type: entity
  parent: SolreignPaperLoreBase
  id: SolreignPaperTerminusLog3
  name: "antimatter chamber decommission order"
  description: An official order, stamped and countersigned. Someone added a note in the margin afterward, in different ink.
  components:
  - type: Paper
    content: solreign-terminus-log-3
