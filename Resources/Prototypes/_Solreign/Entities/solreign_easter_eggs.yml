# Solreign easter-egg / video-game-reference items.
# Additive cosmetic reskins of real base items — each parents a verified vanilla
# prototype and only overrides name + description. Homage, not copy: no
# trademarked names, logos, or symbols are used.
# Source: docs/research/creative-bible-antigravity.md section 2 (Custom Item entries only).

# 1. Half-Life — crowbar
- type: entity
  parent: CrowbarRed
  id: SolreignCrowbar
  name: theoretical physicist's heavy pry-bar
  description: A tool that has survived multiple resonance cascades. Smells faintly of hazardous materials and silent protagonism.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/pry_bar.rsi
    state: icon
  - type: Item
    storedSprite:
      sprite: _Solreign/EasterEggs/pry_bar.rsi
      state: icon
  # production batch 10 (worn-sprite wave): BaseCrowbar's own Clothing.sprite pointed at
  # crowbar.rsi (vanilla), so belt-holstered showed the plain vanilla crowbar. Overridden;
  # new RSI carries equipped-BELT + storage/cover-* variants (matches CrowbarRed's own
  # cover-icon idiom).
  - type: Clothing
    sprite: _Solreign/EasterEggs/pry_bar.rsi

