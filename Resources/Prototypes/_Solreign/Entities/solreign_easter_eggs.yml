# 3. Deus Ex — trench coat
# BALANCE (feedback #7, FEEDBACK-SMALL-2026-07-16): base ClothingOuterCoatTrench only had
# Armor.coefficients: { Slash: 0.95 } (5% reduction, armor in name only). Given real but
# sub-vest protection here — Blunt/Slash/Piercing 0.88 vs. the standard Type I security vest's
# 0.70 (ClothingOuterArmorBase) — because this ALSO carries free storage (parents
# ClothingOuterStorageEdible via ClothingOuterCoatTrench) that a security vest doesn't, and it's an
# unrestricted easter-egg find, not a Security-only issue item. Stacking full vest-tier armor onto
# free storage on an item anyone can find would be overtuned. No Heat/Explosion bonus added.
- type: entity
  parent: ClothingOuterCoatTrench
  id: SolreignNanowareTrenchCoat
  name: nanoware trench-coat
  description: Perfect for wearing at night, indoors, or while assassinating corporate board members.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/nanoware_trenchcoat.rsi
    state: icon
  - type: Item
    storedSprite:
      sprite: _Solreign/EasterEggs/nanoware_trenchcoat.rsi
      state: icon
  # production batch 10 (worn-sprite wave): ClothingOuterCoatTrench's own Clothing.sprite
  # pointed at trenchcoat.rsi (vanilla), so worn showed the plain vanilla coat. Overridden;
  # new RSI carries the open/closed equipped-OUTERCLOTHING pair + inhand variants.
  - type: Clothing
    sprite: _Solreign/EasterEggs/nanoware_trenchcoat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.88
        Slash: 0.88
        Piercing: 0.88

