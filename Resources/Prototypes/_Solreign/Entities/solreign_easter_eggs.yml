# 10. Dark Souls — estus / medical flask
# FIX (player-feedback batch 2026-07-16, item 2): DrinkFlaskBar -> FlaskBase carries
# DrinkVisualsOpenable, whose GenericVisualizer swaps to state "icon_open" on open --
# this RSI had only "icon", so opening it errored. Also had zero inhand states: no
# ancestor in the drink-flask chain sets Item.InhandVisuals or Item.sprite, so this
# takes the *checked* default-visuals path (Content.Client/Items/Systems/ItemSystem.cs
# TryGetDefaultVisuals) -- unlike item 1's crash, a missing state here would just
# silently show nothing in-hand rather than error. Added icon_open (procedurally
# derived: cap-disc stripped + warm glow on the exposed neck) + inhand-left/right
# (procedurally rigged) -- see docs/receipts/feedback-bugs/.
- type: entity
  parent: DrinkFlaskBar
  id: SolreignLiquidFlameThermos
  name: liquid flame thermos
  description: A dull brass flask containing a warm, glowing yellow soup. Restores health at the cost of making you feel incredibly weary.
  components:
  - type: Sprite
    sprite: _Solreign/EasterEggs/liquid_flame_thermos.rsi
    state: icon
  - type: Item
    storedSprite:
      sprite: _Solreign/EasterEggs/liquid_flame_thermos.rsi
      state: icon

