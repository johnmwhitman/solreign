# Solreign chaos-tier weapons: kid-safe toy reskins for general-population vendors.
# Roadmap: martial arts + weapons variety lane (drip-feed doctrine — small, frequent,
# discoverable additions rather than one big dump).
#
# Pattern followed throughout this file: these are DATA-ONLY reskins. Reuse an existing
# upstream (or Solreign) entity's mechanics/sprite wholesale, override only id/name/
# description/suffix (+ occasional acid-green Sprite tint, the established Solreign
# reskin idiom — see _Solreign/Entities/delighters/pool_noodle.yml). No new components,
# no new C# — none needed for a toy reskin.
#
# Upstream examples read before writing this file:
#   - Entities/Objects/Fun/weapons.yml            (BaseToyGun / BaseToySword / ToyHammer
#     idiom: PacifismAllowedGun, near-zero MeleeWeapon damage = "kid-safe")
#   - Entities/Objects/Weapons/Guns/Basic/watergun.yml (WeaponWaterPistol / WeaponWaterBlaster
#     / WeaponWaterBlasterSuper — the latter is a dormant base: not in any vendor, loot
#     table, or map at audit time)
#   - Entities/Objects/Weapons/Melee/baseball_bat.yml  (WeaponMeleeKnockbackStick — dormant,
#     `categories: [ DoNotMap ]`, not in any vendor/loot/map at audit time)
#   - Entities/Objects/Weapons/Guns/pneumatic_cannon.yml (LauncherCreamPie — placed on some
#     maps but never vendored)
#   - Entities/Objects/Consumable/Food/Baked/pie.yml (FoodPieBananaCream already carries
#     CreamPie + ThrowingAngle + LandAtCursor and zero damage components — genuinely
#     kid-safe out of the box, no stripping needed)
#   - _Solreign/Entities/delighters/pool_noodle.yml (house style for the reskin idiom:
#     acid-green tint, suffix convention, corporate-deadpan description voice)
#
# Dormant-base audit (Resources/Prototypes/Entities/Objects/Weapons, cross-checked against
# Catalog/VendingMachines, Entities/Markers/Spawners, and Resources/Maps): WeaponWaterBlasterSuper
# and WeaponMeleeKnockbackStick were NOT referenced anywhere outside their own defining file.
# Both are reactivated here as the chassis for two of the eight reskins below.
#
# All eight items are vendor-ready (see games.yml / happyhonk.yml edits in the same PR).
# Contraband status is inherited from the base prototype, not invented here — see the
# per-item notes.

## Water blaster variants (no Contraband on the upstream base — general population safe)

- type: entity
  parent: WeaponWaterPistol
  id: SolreignFizzSoaker
  name: fizz soaker
  suffix: solreign, chaos-tier
  description: Solreign Recreation Division water pistol, twelve shots of pre-approved joy. Aim responsibly — morale metrics do not cover eye injuries.

- type: entity
  parent: WeaponWaterBlasterSuper # reactivated dormant base, see audit note above
  id: SolreignHydroBlasterMax
  name: Hydro-Blaster Max
  suffix: solreign, chaos-tier
  description: The flagship of the Solreign Recreation Division catalog. Ninety-six shots of hydration warfare. Previously shelved pending a liability review that never actually happened.

## Cream-pie-launcher-alikes (upstream bases carry no Contraband either)

- type: entity
  parent: LauncherCreamPie
  id: SolreignPastryPersuader
  name: pastry persuader
  suffix: solreign, chaos-tier
  description: A Solreign-branded pie cannon. Load with company-approved dessert product for a fully compliant pieing. Structural integrity of the pie itself is not guaranteed.

- type: entity
  parent: FoodPieBananaCream
  id: SolreignSplatPie
  name: Solreign splat pie
  suffix: solreign, chaos-tier
  description: A banana cream pie stamped with the Solreign wordmark. Throws clean, lands funny, does zero recorded damage. HR has cleared this pie for interoffice use.

