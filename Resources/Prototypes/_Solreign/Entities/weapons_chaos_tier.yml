## Knockback bat (and a second blunt-chaos toy) — upstream bases DO carry Contraband
## (BaseBallBat -> BaseMinorContraband). Kept as minor contraband on purpose — a bat-shaped
## object still reads as a bat-shaped object — so these two are vendored via
## contrabandInventory, matching the existing games.yml convention (Basketball, snacks, etc.)

- type: entity
  parent: WeaponMeleeKnockbackStick # reactivated dormant base, see audit note above
  id: SolreignKnockoutBat
  name: compliance knockout bat
  suffix: solreign, chaos-tier
  description: A padded acid-green bat that turns confrontations into gentle physics demonstrations. Solreign Wellness calls this "kinetic conflict resolution."
  categories: [ ] # clears the inherited DoNotMap — this reskin is a real, vendor-ready item
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/baseball_bat.rsi
    state: icon
    color: "#9dfd39" # Solreign acid-green, matches pool_noodle.yml convention
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 0 # completely harmless; the knockback is the point
    soundHit:
      path: /Audio/Items/Toys/mousesqueek.ogg
  - type: MeleeThrowOnHit # upstream default is speed 10 / distance 20; tuned down for "gentle chaos"
    speed: 6
    distance: 5
  - type: IncreaseDamageOnWield # BaseBallBat's wield bonus (Blunt 5 / Structural 10) would
    damage:                     # otherwise still apply on top of the Blunt: 0 above — zero it
      types:                    # so this stays harmless in every grip state, not just unwielded.
        Blunt: 0
        Structural: 0

- type: entity
  parent: ToyHammer
  id: SolreignLuckyMallet
  name: Solreign lucky mallet
  suffix: solreign, chaos-tier
  description: A rubber mallet in corporate acid-green. One in one-hundred-thousand swings ends the argument outright. Solreign Legal insists the odds are "basically zero."
  components:
  - type: Sprite
    sprite: Objects/Fun/rubber_hammer.rsi
    state: icon
    color: "#9dfd39"
