  text: "/ServerInfo/_Solreign/Guidebook/RequisitionsAnonymous.xml"

- type: guideEntry
  id: SolreignLiabilityBoardGuide
  name: guide-entry-solreign-liability-board
  text: "/ServerInfo/_Solreign/Guidebook/LiabilityBoard.xml"

- type: guideEntry
  id: SolreignWingmatesGuide
  name: guide-entry-solreign-wingmates
  text: "/ServerInfo/_Solreign/Guidebook/WingmatesGuide.xml"

- type: guideEntry
  id: SolreignSalaryStandingGuide
