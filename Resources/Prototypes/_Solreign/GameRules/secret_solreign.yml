# Solreign default Secret weighting — tuned for the council's 8-15 pop, shorter/chaotic rounds.
#
# How upstream Secret works (Content.Server/GameTicking/Rules/SecretRuleSystem.cs):
# - The SecretRule reads CVar `game.secret_weight_prototype` (CCVars.Game.cs:368, default "Secret")
#   and rolls a preset from that weightedRandom table; presets whose rules fail their
#   GameRule.minPlayers gate are excluded and the roll re-runs (fail-safe at low pop).
#
# ── DEPLOYMENT (config, not C#): in the server's server_config.toml add ──
#   [game]
#   secret_weight_prototype = "SolreignSecret"
# That single line makes this table the Solreign default; the upstream "Secret" table stays
# untouched as a rollback. No C# gap — the hook is already a data-driven CVar.
#
# Weighting rationale vs upstream (Nukeops .20 / Traitor .55 / Zombie .05 / Survival .10 / Rev .05):
# - Nukeops (min 20), Zombie (min 20), Revolutionary (min 15) can almost never fire at 8-15 pop;
#   they'd just be dead weight that re-rolls. Dropped.
# - SolreignAntagsOnSpawn (our chaos preset, min 3) carries the "chaotic" mandate.
# - KesslerSyndrome (meteor hell, no antag min) is the short-round pressure valve.
# - Traitor stays the bread-and-butter; Survival keeps a calm-round breather in the pool.
# - SolreignChangelingPreset (Talent Acquisition Specialist, min 8 — reachable at Solreign's own
#   8-15 floor, unlike the min-20+ rules above) is new round integration, spec §6:
#   docs/specs/2026-07-11-changeling-spec.md. Note the -Preset suffix: this table is rolled as a
#   weightedRandom of *gamePreset* ids (SecretRuleSystem.TryPickPreset -> TryIndex<GamePresetPrototype>),
#   so it must name the gamePreset wrapper (GameRules/changeling.yml), NOT the raw SolreignChangeling
#   GameRule (a type:entity), which would fail to resolve and re-roll. Deliberately low weight — a fresh antag pack earns
#   more table share once it's seen a few rounds of play, not on day one. Traitor gives up 0.05 to
#   keep the table summing to 1.00.
# (Supersession note 2026-07-19: the master-line interim fix REMOVED the broken raw-rule
#  entry; this -Preset wrapper is the proper fix and re-seats the 0.05. cdx odds analysis
#  banked in ops docs/reviews.)

- type: weightedRandom
  id: SolreignSecret
  weights:
    Traitor: 0.35
    SolreignAntagsOnSpawn: 0.35
    Survival: 0.15
    KesslerSyndrome: 0.10
    SolreignChangelingPreset: 0.05
