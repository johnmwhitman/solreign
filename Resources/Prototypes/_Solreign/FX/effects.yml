# Redacted broadcast cover for `transformation` (spec §2.2, §5.2). Every numeric field a real
# RaiseSecretRoleCue call ships is scrubbed to THIS prototype's own defaults, never the detail
# cue's values — so this prototype's palette/phase axes stay a single neutral entry each,
# deliberately: any per-instance variation here would itself become a side channel (grk #2:
# "parameter fingerprinting").
- type: solreignFxCue
  id: transformation_generic
  audienceClassification: Broadcast
  minIntensity: 0.0
  maxIntensity: 1.0
  minScale: 0.5
  maxScale: 2.0
  minDuration: 0.2
  maxDuration: 3.0
  defaultIntensity: 0.5
  defaultScale: 1.0
  defaultDuration: 1.2
  paletteCount: 1
  defaultPaletteIndex: 0
  phaseCount: 1
  defaultPhaseIndex: 0

- type: solreignFxCue
  id: stamina_break
  audienceClassification: Broadcast
  genericVariant: body_shock_generic
  minIntensity: 0.0
  maxIntensity: 1.0
  minScale: 0.5
  maxScale: 1.5
  minDuration: 0.2
  maxDuration: 0.6
  defaultIntensity: 0.6
  defaultScale: 1.0
  defaultDuration: 0.6
  paletteCount: 2
  defaultPaletteIndex: 0
  phaseCount: 1
  defaultPhaseIndex: 0

# The non-secret "body convulsion/shock" cover id (spec §2.2, grk #2B) — electrocution recovery,
# stamina-collapse recoveries, and any other secret-role ability that reaches for `electrical`/
# `cast_ring`/`stamina_break` all share THIS generic broadcast id as their redacted variant, so the
# redacted vocabulary has multiple innocuous producers (not a size-1 oracle). Real non-secret
# producers for these moments are a later wave's job (spec §2.2's own "until those producers land,
# acknowledged as incomplete" caveat) — this worktree only makes the id exist and be well-formed.
#
# paletteCount/phaseCount are DELIBERATELY 1 (a single neutral entry), same reasoning as
# transformation_generic above (grk W3 round-1 review finding #6): body_shock_generic covers THREE
# secret-role-reachable primitives (electrical/cast_ring/stamina_break), a larger redaction surface
# than transformation_generic's one — any per-instance palette/phase variation here would let a
# bystander distinguish which secret ability actually fired by color, exactly the "parameter
# fingerprinting" grk #2 already flagged for the transformation case.
- type: solreignFxCue
  id: body_shock_generic
  audienceClassification: Broadcast
  minIntensity: 0.0
  maxIntensity: 1.0
  minScale: 0.5
  maxScale: 1.5
  minDuration: 0.2
  maxDuration: 0.6
  defaultIntensity: 0.5
  defaultScale: 1.0
  defaultDuration: 0.6
  paletteCount: 1
  defaultPaletteIndex: 0
  phaseCount: 1
  defaultPhaseIndex: 0
