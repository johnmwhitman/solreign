# FX Language v1 — the 10-id wire allowlist's actual content (docs/specs/FX-LANGUAGE-V1-SPEC-2026-07-16.md
# §2/§2.2, W3 `fx-primitives-v1`). Every entry here is checked at load time
# (Content.Shared._Solreign.FX.SolreignFxCuePrototypeValidation) and cross-checked for exact
# membership + audience-classification parity against the sealed
# Content.Shared._Solreign.FX.SolreignFxWireAllowlist.V1/AudienceClassificationV1 manifest by
# Content.Tests._Solreign.FX.SolreignFxEffectsYamlConsistencyTests and
# Content.IntegrationTests.Tests._Solreign.FX.SolreignFxEffectsPrototypeConsistencyTest.
#
# Everything here is DORMANT: no system raises any of these ids yet (W4 is FxCue's first real
# caller, the changeling arm-blade), and the whole language stays behind solreign.fx.cue_v1 = false.
#
# Bounds are provisional engineering defaults (spec §3's own caveat, applied here to the content
# layer too) — durations are set to bracket Content.Shared._Solreign.FX.SolreignFxCategoryTable's
# already-shipped (W2) per-category DurationCapSeconds, which is the value that actually governs
# how long a pooled activation lives; a prototype's own MaxDuration only bounds what a future raiser
# may REQUEST before that per-category cap clamps it further.

- type: solreignFxCue
  id: impact_light
  audienceClassification: Broadcast
  minIntensity: 0.0
  maxIntensity: 1.0
  minScale: 0.5
  maxScale: 1.5
  minDuration: 0.1
  maxDuration: 0.4
  defaultIntensity: 0.6
  defaultScale: 1.0
  defaultDuration: 0.4
  paletteCount: 4
  defaultPaletteIndex: 0
  phaseCount: 1
  defaultPhaseIndex: 0

