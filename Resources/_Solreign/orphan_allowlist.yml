# Solreign orphan-reachability allowlist
# Consumed by Content.Tests/_Solreign/SolreignOrphanReachabilityTest.cs (Phase-3 Wave 22).
#
# Every non-abstract Solreign entity that is intentionally unreachable via map / vendor /
# spawner / game-rule / craft / seed / contract / loadout MUST be listed here with a
# non-empty reason:. "Scoped-as-designed" is never silent — that is the whole point of
# the gate (docs/AUDIT-2026-07-12.md S23; docs/ROADMAP-PHASE3.md Wave 22).
#
# Format (list of mappings):
#   - id: SolreignSomeEntity
#     reason: "Why this is admin-only / by-design unreachable, or which C# system spawns it."
#
# Do NOT list abstract templates (abstract: true) — the scanner already skips those.
# Do NOT use this file to paper over real orphans; re-home them (Wave 21 class) instead.
# EXCEPTION, called out honestly rather than hidden: the golf ball + hole were a genuine
# "built but never mapped" gap until MapPatch minigolf-v1 landed them on solreign_terminus.yml.

# --- Golf club variant (audit S23) — admin-spawn recreation prop, not round loot ---
# The putter is now placed on solreign_terminus.yml via the mini-golf course
# (see minigolf-v1 below), so it is no longer orphan and the entry is removed.
- id: SolreignGolfClubDriver
  reason: >-
    Admin-only-by-design mini-golf club variant (audit S23). Recreation pack deliberately
    leaves the driver as a mapper/admin toy rather than vending-machine loot. (The putter
    counterpart is placed on solreign_terminus.yml by minigolf-v1 and no longer needs an
    entry here.)

# --- Mini-golf ball + hole (recreation.yml) — RESOLVED by MapPatch minigolf-v1 ---
# Both prototypes are now placed on solreign_terminus.yml via
# Tools/_Solreign/MapPatch/manifests/minigolf-v1.json (patch_id "minigolf-v1",
# anchor SolreignSignGrandPrixWelcome uid 90005 in the Park, 3 placements on
# FloorMowedAstroGrass within max_manhattan_tiles=8). The earlier "GENUINE GAP"
# entries are removed in the same wave that landed the course; the driver above
# stays as admin-only-by-design.


