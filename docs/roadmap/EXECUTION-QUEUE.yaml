      - Failure is specific and private rather than a dead click.
      - Low population cannot assign an impossible objective.

  - id: RETURN-CALLBACK
    priority: 4
    title: Recall one meaningful prior-round choice on return
    state: candidate
    player_value: A returning player sees that the station remembers something that mattered.
    depends_on:
