    constraints:
      - Reuse Season Ledger, First Death, or Shift Archive durable state.
      - Add no progression currency, grind loop, analytics platform, or private-player exposure.
    acceptance:
      - A returning player sees one truthful prior-round callback.
      - Missing history has a coherent fresh-player fallback.
      - Stale or mismatched identity fails closed.
